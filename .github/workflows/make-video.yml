name: make-and-upload-video
on:
  schedule:
    - cron: "0 12 * * *"   # daily check; script only builds if last video is 2+ days old
  workflow_dispatch:
concurrency: yt-bot
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python generate_video.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: hashFiles('output/video.mp4') != ''
        with:
          name: video
          path: |
            output/video.mp4
            output/thumbnail.jpg
            output/meta.json
      - run: python upload_video.py
        if: hashFiles('output/video.mp4') != ''
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: public
      - name: Save state
        if: always()
        run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
